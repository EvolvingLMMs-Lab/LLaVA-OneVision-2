name: Update community assets

on:
  push:
    branches:
      - main
  schedule:
    # Monthly refresh on the first day of each month.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serialize every community asset refresh and Pages deploy.
  group: update-community-assets
  cancel-in-progress: false

jobs:
  build-community-assets:
    # Skip the run we triggered ourselves to avoid an infinite loop.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build community.json (contributors + stargazers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python docs/build_community_json.py \
            --owner "${GITHUB_REPOSITORY%/*}" \
            --repo  "${GITHUB_REPOSITORY#*/}" \
            --add   YunyaoYan:1

      - name: Build contributors SVGs and update README
        run: |
          python docs/build_contributors_svg.py \
            --data      docs/page/assets/community.json \
            --limit     12 \
            --out-dark  asset/contributors_dark.svg \
            --out-light asset/contributors_light.svg \
            --readme    README.md

      - name: Commit and push if changed
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            docs/page/assets/community.json
            asset/contributors_dark.svg
            asset/contributors_light.svg
            README.md
          )
          if [[ -z "$(git status --porcelain "${paths[@]}")" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git add "${paths[@]}"
          git commit -m "docs: refresh community assets"
          # Other writers can advance main even after our pull completes.
          # Retry the pull/push pair; a rebase conflict still fails immediately.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Push failed (attempt $attempt/3); syncing main before retry."
              sleep "$((attempt * 2))"
            fi
          done
          echo "::error::Unable to push community assets after 3 attempts."
          exit 1

      # Deploy Pages in the same workflow. We intentionally do NOT re-checkout
      # between the push and these steps — the working tree still has the
      # the generated assets we just committed, which are what we want uploaded.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

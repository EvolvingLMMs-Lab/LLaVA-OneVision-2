<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2640 320" width="100%" height="100%">
  <style>
    /* accent pulses between the two lmms-lab.com theme colours: cyan #04d9ed and magenta #ff2b9f */
    .ov25-accent {
      transform-box: fill-box;
      transform-origin: left center;
      animation: ov25-pulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes ov25-pulse {
      0%   { fill: #04d9ed; transform: scale(1); }
      40%  { fill: #ff2b9f; transform: scale(1.05); }
      100% { fill: #04d9ed; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ov25-accent { animation: none; fill: #ff2b9f; }
    }
  </style>
  <text x="16" y="78%" dominant-baseline="alphabetic" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="240" letter-spacing="-0.045em">
    <tspan font-weight="700" fill="#FAFAFA">LLaVA-OneVision</tspan><tspan class="ov25-accent" font-weight="500" fill="#ff2b9f">&#8202;2.5</tspan>
  </text>
</svg>

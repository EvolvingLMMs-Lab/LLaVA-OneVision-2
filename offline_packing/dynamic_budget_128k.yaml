# dynamic_budget_128k.yaml — Scheme D for LONG videos (128k bin). 2026-07-27
# Long-video variant: 128k bin, much larger visual budget, fps gradient becomes relevant again for long videos.
mode: dynamic
resolution:
  values:  [150000, 200000, 250000, 300000]
  weights: [0.30, 0.30, 0.25, 0.15]
fps:
  values:  [1.0, 0.7, 0.5, 0.33]
  weights: [0.40, 0.30, 0.20, 0.10]
budget_tokens: 110000       # per-video visual-token cap (128k bin, leaves ~18k for text + 47m)
min_frames: 200
max_frames: 1536            # relaxed (long videos can reach ~900-1300 frames under 128k)
patch_size: 16
factor_multiplier: 3
min_pixels_floor: 3136
temporal_grid: 2
seed: 20260727
hard_total_tokens: 128000   # bin hard cap
topup_safety_reserve: 2000
chars_per_token_est: 3.0

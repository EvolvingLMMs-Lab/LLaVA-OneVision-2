# dynamic_budget_bin110k_video.yaml — 纯视频最大化, bin 总长 110k (不掺 47m 单图)
# bin=110000 总长; 视觉预算 = min(budget_tokens=95000, 110000 - text_tok_est - reserve0)
#   long_expand caption 很长(text_tok_est p50~15k, p90~27k), 视觉随文本自动让位.
# 配套 driver: run_pack_master.sh (无 s3b/无 47m).
mode: dynamic

resolution:
  values:  [150000, 200000, 250000, 300000]
  weights: [0.30, 0.30, 0.25, 0.15]

fps:
  values:  [1.0, 0.7, 0.5, 0.33]
  weights: [0.40, 0.30, 0.20, 0.10]

budget_tokens: 95000         # 视觉上限封顶(短文本视频视觉顶到 ~95k)
min_frames: 200
max_frames: 1536
patch_size: 16
factor_multiplier: 3         # tok/帧 = 分辨率 / 2304
min_pixels_floor: 3136
temporal_grid: 2
seed: 20260727

hard_total_tokens: 110000    # bin 总长上限(你指定的 110k)
topup_safety_reserve: 0      # 纯视频, 不为 47m 留白
chars_per_token_est: 3.0     # text-aware: 视觉 = min(95000, 110000 - text_est - 0)

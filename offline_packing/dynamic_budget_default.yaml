# dynamic_budget_default.yaml  —  Scheme D (2026-07-23)
# Default "dynamic visual-token budget" config for long-video packing.
# Per sample: draw (resolution, fps) at random by weight  ->  frames = round(fps * duration), then capped by budget.
# NOT a hard duration->frames mapping — weighted random sampling (with a reproducible seed) gives diversity. 47m topup fills the leftover slack.
# Expected (batch2 10-15min estimate): frames 200->846, p50~499, >=512 ~34%, 47m ~29%.
mode: dynamic

resolution:                                  # min_pixels = max_pixels, sampled by weight
  values:  [150000, 200000, 250000, 300000]
  weights: [0.30, 0.30, 0.25, 0.15]

fps:                                         # cap 1.0 (matches master 1fps), a few steps below
  values:  [1.0, 0.7, 0.5, 0.33]
  weights: [0.40, 0.30, 0.20, 0.10]

budget_tokens: 55000        # per-sample video visual-token cap (64k bin, leaves slack for 47m + text)
min_frames: 200             # frame-count floor
max_frames: 960             # frame-count hard cap (budget usually caps first; rarely hit)
patch_size: 16
factor_multiplier: 3        # tok/frame = MP / (patch^2 * factor^2) = MP / 2304
min_pixels_floor: 3136      # 56*56, smart_resize floor
temporal_grid: 2            # frame count rounded to a multiple of temporal_grid (even)
seed: 20260723              # base seed; per-sample RNG = f(seed, sample_id) -> random but reproducible

# ---- text-aware budget (2026-07-23 fix: keep long captions from busting 64k and being dropped by s2) ----
hard_total_tokens: 64000    # bin hard cap; visual budget = 64000 - text_estimate - reserve (then capped by budget_tokens)
topup_safety_reserve: 2000  # reserved for 47m topup + safety margin
chars_per_token_est: 3.0    # text tokens ~= ceil(chars / 3.0); conservative (measured chars/token min=3.26), never underestimate
